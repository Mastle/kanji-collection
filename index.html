<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanji Vault Flashcards</title>
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --accent: #6366f1;
        --subtext: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        user-select: none;
      }

      .container {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .header {
        display: flex;
        justify-content: space-between;
        width: 100%;
        color: var(--subtext);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .card {
        background-color: var(--card-bg);
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .card:active {
        transform: scale(0.98);
      }

      .kanji-text {
        font-size: 7rem;
        font-weight: 500;
        line-height: 1;
      }

      .btn {
        width: 100%;
        padding: 1rem;
        border: none;
        border-radius: 1rem;
        background-color: var(--accent);
        color: white;
        font-size: 1.125rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        transition: opacity 0.15s ease;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .hint {
        color: var(--subtext);
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <span>KANJI DECK</span>
        <span id="counter">0 / 255</span>
      </div>

      <div class="card" id="card" onclick="nextCard()">
        <div class="kanji-text" id="kanji-display">...</div>
      </div>

      <button class="btn" onclick="nextCard()">Next Kanji</button>
      <div class="hint">Tap card or press Space / Right Arrow</div>
    </div>

        "界",
        "曇",
      ]

      let deck = []
      let currentIndex = 0

      // Fisher-Yates Shuffle
      function shuffle(array) {
        const shuffled = [...array]
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]
        }
        return shuffled
      }

      function initDeck() {
        deck = shuffle(KANJI_POOL)
        currentIndex = 0
      }

      function nextCard() {
        if (currentIndex >= deck.length) {
          initDeck() // Reshuffle when full deck is completed
        }

        document.getElementById("kanji-display").innerText = deck[currentIndex]
        document.getElementById("counter").innerText =
          `${currentIndex + 1} / ${deck.length}`
        currentIndex++
      }

      // Keyboard support
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowRight") {
          e.preventDefault()
          nextCard()
        }
      })

      // Start on load
      initDeck()
      nextCard()
    </script>
